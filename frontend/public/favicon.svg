<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SteelAnalyze">
  <defs>
    <linearGradient id="sa-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A3B1BF"/>
      <stop offset="0.5" stop-color="#6B7B8C"/>
      <stop offset="1" stop-color="#3B4652"/>
    </linearGradient>
    <clipPath id="sa-plate">
      <rect x="4" y="4" width="56" height="56" rx="12"/>
    </clipPath>
  </defs>

  <!-- Стальной лист -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#sa-steel)"/>
  <!-- Следы прокатки -->
  <g clip-path="url(#sa-plate)" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2">
    <path d="M-4 18 L68 6 M-4 32 L68 20 M-4 46 L68 34 M-4 60 L68 48 M-4 74 L68 62"/>
  </g>

  <!-- Лупа -->
  <circle cx="29" cy="29" r="13" fill="#FFFFFF" fill-opacity="0.14" stroke="#FFFFFF" stroke-width="4"/>
  <path d="M38.5 38.5 L51 51" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  <!-- Трещина под лупой -->
  <path d="M20 35 L26 31 L24 26 L30 24 L35 20" fill="none" stroke="#F59E0B" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
